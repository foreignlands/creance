[workspace]
resolver = "2"
members = [
    "crates/creance",
    "crates/creance-gate",
    "crates/creance-net",
    "crates/creance-proxy",
    "crates/creance-vm",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/foreignlands/creance"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

creance-net = { path = "crates/creance-net" }
creance-vm = { path = "crates/creance-vm" }
creance-proxy = { path = "crates/creance-proxy" }
creance-gate = { path = "crates/creance-gate" }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = true
strip = true
