[workspace]
resolver = "2"
members = ["crates/cage-core", "crates/cage"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Lee-xeo/Claude-Cage"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
lto = true
strip = true
