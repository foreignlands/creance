[package]
name = "creance-vm"
description = "Host and guest orchestration: profile config, paths, naming, state, Lima lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
libc = { workspace = true }
creance-net = { workspace = true }
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
base64 = "0.23.1"
keyring = "4.2.0"

# vFAT seed images — built by the Linux QEMU backend only (qemu/seed.rs);
# a plain dependency would draw an unused-dependency lint on every macOS build.
[target.'cfg(target_os = "linux")'.dependencies]
fatfs = { workspace = true }

[lints]
workspace = true
