<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>creance</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#f5f5f7; --card:#ffffff; --line:#e3e4e9; --line-strong:#d1d1d6;
    --text:#1d1d1f; --dim:#86868b; --faint:#aeaeb2;
    --ok:#34c759; --bad:#ff3b30; --warn:#ff9500;
    --accent:#0071e3; --accent-press:#0063c4;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000000; --card:#1c1c1e; --line:#2c2c2e; --line-strong:#3a3a3c;
      --text:#f5f5f7; --dim:#98989d; --faint:#636366;
      --ok:#30d158; --bad:#ff453a; --warn:#ff9f0a;
      --accent:#0a84ff; --accent-press:#409cff;
    }
  }
  * { box-sizing:border-box; margin:0; }
  html { -webkit-font-smoothing:antialiased; }
  body {
    background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    padding:28px 24px 48px; max-width:1024px; margin:0 auto;
  }
  header { display:flex; align-items:baseline; gap:12px; margin-bottom:22px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:12.5px; }
  header .live { margin-left:auto; display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--dim); }
  .live::before { content:""; width:8px; height:8px; border-radius:50%;
    background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent); }
  .live.off::before { background:var(--faint); box-shadow:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .card h2 { font-size:11.5px; font-weight:600; color:var(--dim);
    text-transform:uppercase; letter-spacing:.07em; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center;
    gap:10px; padding:5px 0; border-bottom:1px solid var(--line); }
  .row:last-of-type { border-bottom:0; }
  .k { color:var(--dim); font-size:13px; }
  .v { font-size:13px; text-align:right; word-break:break-all; font-weight:500; }
  .v.mono { font-family:var(--mono); font-size:12px; font-weight:400; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-right:6px; vertical-align:1px; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .dot.warn { background:var(--warn); } .dot.none { background:var(--faint); }
  .pill { padding:2px 10px; border-radius:99px; font-size:11.5px; font-weight:500;
    border:1px solid var(--line-strong); color:var(--dim); white-space:nowrap; }
  .pill.ok { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,transparent);
    background:color-mix(in srgb,var(--ok) 10%,transparent); }
  .pill.bad { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 45%,transparent);
    background:color-mix(in srgb,var(--bad) 10%,transparent); }
  .pill.warn { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,transparent);
    background:color-mix(in srgb,var(--warn) 10%,transparent); }
  button {
    background:var(--accent); color:#fff; border:0; border-radius:9px;
    padding:7px 16px; font-size:13px; font-weight:500; font-family:inherit;
    cursor:pointer; transition:background .12s, transform .05s;
  }
  button:hover { background:var(--accent-press); }
  button:active { transform:scale(.97); }
  button.ghost { background:transparent; border:1px solid var(--line-strong); color:var(--text); }
  button.ghost:hover { border-color:var(--dim); background:transparent; }
  button:disabled { opacity:.45; cursor:default; transform:none; }
  button.busy { position:relative; color:transparent; }
  button.busy::after { content:""; position:absolute; inset:0; margin:auto;
    width:13px; height:13px; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); border-top-color:#fff;
    animation:spin .7s linear infinite; }
  button.ghost.busy::after { border-color:var(--line-strong); border-top-color:var(--dim); }
  @keyframes spin { to { transform:rotate(360deg); } }
  input {
    background:var(--bg); color:var(--text); border:1px solid var(--line-strong);
    border-radius:9px; padding:8px 12px; font-size:13px; font-family:inherit;
    width:100%; outline:none; transition:border-color .12s, box-shadow .12s;
  }
  input:focus { border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent); }
  label { display:block; color:var(--dim); font-size:12px; font-weight:500; margin:10px 0 5px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  #log { font:11.5px/1.6 var(--mono); color:var(--dim); height:132px; overflow:auto;
    background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:10px 12px; }
  #log .t { color:var(--faint); margin-right:6px; }
  #log .err-line { color:var(--bad); }
  .nodes { max-height:260px; overflow:auto; margin:0 -8px; }
  .node { display:flex; gap:10px; align-items:center; padding:8px 10px;
    border-radius:9px; cursor:pointer; transition:background .1s; }
  .node:hover { background:color-mix(in srgb,var(--dim) 8%,transparent); }
  .node.sel { background:color-mix(in srgb,var(--accent) 10%,transparent); }
  .node .n { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node .t { color:var(--faint); font-size:11.5px; font-family:var(--mono); margin-left:auto; }
  .node .cur { margin-left:4px; }
  .empty { color:var(--faint); font-size:13px; padding:24px 0; text-align:center; }
  .full { grid-column:1/-1; }
  .err { color:var(--bad); font-size:12px; margin-top:8px; min-height:16px; white-space:pre-wrap; }
  .hint { color:var(--faint); font-size:11.5px; margin-top:6px; }
  textarea { background:var(--bg); color:var(--text); border:1px solid var(--line-strong);
    border-radius:9px; padding:8px 12px; font:12px/1.5 var(--mono);
    width:100%; outline:none; resize:vertical; transition:border-color .12s, box-shadow .12s; }
  textarea:focus { border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent); }
  label.ck { display:flex; align-items:center; gap:7px; margin-top:12px; font-size:12.5px;
    color:var(--text); cursor:pointer; }
  label.ck input { width:auto; }
  .scan-item { display:flex; align-items:center; gap:10px; padding:8px 10px; margin-top:8px;
    border:1px solid var(--line); border-radius:9px; }
  .scan-item .p { font:11.5px var(--mono); color:var(--dim); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .scan-item input { width:130px; flex:none; }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  body { max-width:1200px; }
  .shell { display:flex; gap:18px; align-items:flex-start; }
  .sidebar { width:196px; flex:none; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px 10px; position:sticky; top:20px; }
  .sidebar h3 { font-size:11px; font-weight:600; color:var(--dim); text-transform:uppercase;
    letter-spacing:.07em; margin:10px 8px 6px; }
  .sidebar h3:first-child { margin-top:2px; }
  .side-item { display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:9px;
    cursor:pointer; transition:background .1s; font-size:13px; }
  .side-item:hover { background:color-mix(in srgb,var(--dim) 8%,transparent); }
  .side-item .ico { width:22px; height:22px; border-radius:6px; flex:none; display:flex;
    align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff;
    background:var(--dim); }
  .side-item .st { margin-left:auto; font-size:10.5px; color:var(--faint); }
  .side-item .st.inst { color:var(--ok); }
  .side-item.busy { opacity:.6; pointer-events:none; }
  .maincol { flex:1; min-width:0; }
  @media (max-width:860px) { .shell { flex-direction:column; } .sidebar { width:100%; position:static; } }
</style>
</head>
<body>
<header>
  <h1>creance</h1>
  <span class="sub">contained workspace</span>
  <span class="live off" id="live">连接中…</span>
</header>

<div class="shell">
<nav class="sidebar">
  <h3>Agents</h3>
  <div id="agent-list"><div class="empty" style="padding:8px">加载中…</div></div>
  <h3>系统</h3>
  <div class="side-item" onclick="document.getElementById('proxy-cards').scrollIntoView({behavior:'smooth'})"><span class="ico" style="background:#0071e3">网</span>节点网络</div>
</nav>
<div class="maincol">
<div class="grid" id="proxy-cards">
  <div class="card">
    <h2>状态</h2>
    <div class="row"><span class="k">实例</span><span class="v mono" id="st-instance">—</span></div>
    <div class="row"><span class="k">出口配置</span><span class="v" id="st-applied">—</span></div>
    <div class="row"><span class="k">核心运行</span><span class="v" id="st-core">—</span></div>
    <div class="row"><span class="k">路由</span><span class="v" id="st-route">—</span></div>
    <div class="row"><span class="k">节点数</span><span class="v" id="st-nodes">—</span></div>
    <div class="row"><span class="k">出口指纹</span><span class="v" id="st-tz">—</span></div>
    <div class="actions">
      <button id="btn-start" onclick="act(this,'/api/proxy/start','核心已启动')">启动核心</button>
      <button class="ghost" id="btn-stop" onclick="act(this,'/api/proxy/stop','核心已停止')">停止核心</button>
      <button class="ghost" id="btn-check" onclick="act(this,'/api/check','出口链路正常','核心不可达或出口异常')">出口检查</button>
    </div>
    <div class="err" id="status-err"></div>
    <div class="hint">出口检查经托管核心请求 1.1.1.1，最长 25 秒。</div>
  </div>

  <div class="card">
    <h2>导入 · 订阅链接</h2>
    <label for="sub-name">来源名称</label>
    <input id="sub-name" placeholder="我的订阅" autocomplete="off">
    <label for="sub-url">订阅 URL</label>
    <input id="sub-url" placeholder="https://example.com/sub" autocomplete="off" spellcheck="false">
    <label class="ck"><input type="checkbox" id="sub-hostdl"> 通过主机网络下载（首次配置尚无可用代理时勾选）</label>
    <div class="hint" id="hostdl-hint">勾选后本次下载直连本机网络，仅用于获取订阅文本；下载完成即恢复代理约束。</div>
    <div class="actions"><button id="btn-import" onclick="importSub(this)">导入</button></div>
    <div class="err" id="import-err"></div>
  </div>

  <div class="card">
    <h2>导入 · 粘贴或文件</h2>
    <label for="paste-name">来源名称</label>
    <input id="paste-name" placeholder="手动节点" autocomplete="off">
    <label for="paste-content">粘贴 Clash YAML 或分享链接（ss://、vmess://、vless://、trojan://、hysteria2://，每行一条）</label>
    <textarea id="paste-content" rows="4" placeholder="vless://… 或 proxies: 开头 YAML" spellcheck="false"></textarea>
    <div class="actions">
      <button id="btn-paste" onclick="importPaste(this)">导入粘贴内容</button>
      <button class="ghost" onclick="document.getElementById('file-pick').click()">选择文件…</button>
      <input type="file" id="file-pick" accept=".yaml,.yml,.txt" style="display:none">
    </div>
    <div class="err" id="paste-err"></div>
  </div>

  <div class="card full">
    <h2>迁移 · 本机已有配置</h2>
    <div class="hint">自动检测本机 Clash Verge / Mihomo / Clash 的配置文件，一键迁移。</div>
    <div class="actions"><button class="ghost" id="btn-scan" onclick="scanLocal(this)">扫描本机配置</button></div>
    <div id="scan-list"></div>
    <div class="err" id="scan-err"></div>
  </div>

  <div class="card full">
    <h2>节点 · 点击应用为出口</h2>
    <div class="nodes" id="node-list"><div class="empty">暂无节点 — 先在上方导入订阅</div></div>
  </div>

  <div class="card full">
    <h2>操作日志</h2>
    <div id="log"></div>
  </div>
</div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(m, isErr) {
  const d = document.createElement('div');
  if (isErr) d.className = 'err-line';
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = new Date().toLocaleTimeString();
  d.append(t, m);
  const L = $('log');
  L.prepend(d);
  while (L.children.length > 200) L.lastChild.remove();
}
async function j(url, body) {
  const r = await fetch(url, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : undefined);
  const v = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(v.error || r.statusText);
  return v;
}
const dot = (cls, label) => `<span class="dot ${cls}"></span>${esc(label)}`;
async function refresh() {
  try {
    const s = await j('/api/status');
    $('live').classList.remove('off');
    $('live').textContent = 'serve 在线';
    $('st-instance').textContent = s.instance || '—';
    $('st-applied').innerHTML = s.applied ? dot('ok','已选择') : dot('warn','未选择');
    $('st-core').innerHTML = s.core_running ? dot('ok','运行中') : dot('none','已停止');
    $('st-route').textContent = (s.route || []).join(' → ') || '—';
    $('st-nodes').textContent = s.nodes;
    $('st-tz').textContent = `${s.timezone || ''} · ${s.locale || ''}`;
    const nodes = await j('/api/nodes');
    $('node-list').innerHTML = nodes.length ? nodes.map(n =>
      `<div class="node ${n.id === s.selected ? 'sel' : ''}" data-id="${esc(n.id)}">
        <span class="n">${esc(n.name)}</span>
        ${n.id === s.selected ? '<span class="pill ok cur">当前</span>' : ''}
        <span class="t">${esc(n.type)} · ${esc(n.source)}</span></div>`).join('')
      : '<div class="empty">暂无节点 — 先在上方导入订阅</div>';
  } catch (e) {
    $('live').classList.add('off');
    $('live').textContent = 'serve 不可达';
  }
}
function busy(btn, on) {
  document.querySelectorAll('button').forEach(b => b.disabled = on);
  if (btn) btn.classList.toggle('busy', on);
}
async function selectNode(id, name) {
  busy(null, true);
  try {
    await j('/api/proxy/select', {node: id});
    log('已选择节点「' + (name || id) + '」');
    try {
      const st = await j('/api/status');
      if (!st.core_running) {
        log('→ 下一步：点击「启动核心」让出口生效；之后可用「出口检查」验证连通');
      } else {
        log('→ 核心运行中，新出口已生效；可用「出口检查」验证连通');
      }
    } catch (_) {}
  }
  catch (e) { log('应用失败: ' + e.message + ' → 若提示配置问题，检查 config 中的代理与 DNS 设置', true); }
  busy(null, false);
  refresh();
}
function advise(e, el, hostdl) {
  // 文案即引导：错误后给出下一步动作而非死路
  let msg = e.message;
  if (/代理|proxy|SOCKS/i.test(msg) && !hostdl) {
    msg += '\n→ 还没有可用代理？勾选「通过主机网络下载」重试；已有订阅则在节点列表先选一个节点。';
  } else if (/无法识别订阅格式|YAML/i.test(msg)) {
    msg += '\n→ 确认链接复制完整；或在右侧用「粘贴或文件」直接导入内容。';
  } else if (/超时|timeout|连接/i.test(msg) && !hostdl) {
    msg += '\n→ 若是首次配置无代理可用，勾选「通过主机网络下载」。';
  }
  el.textContent = msg;
}
async function importSub(btn) {
  $('import-err').textContent = '';
  const name = $('sub-name').value.trim(), url = $('sub-url').value.trim();
  const hostdl = $('sub-hostdl').checked;
  if (!name || !url) { $('import-err').textContent = '名称与 URL 均不能为空'; return; }
  busy(btn, true);
  try {
    const r = await j('/api/proxy/import', {name, url, host_download: hostdl});
    log(`导入成功，共 ${r.nodes} 个节点 — 在下方点击一个节点即可应用`);
    $('sub-url').value = '';
  } catch (e) { advise(e, $('import-err'), hostdl); log('导入失败: ' + e.message, true); }
  busy(btn, false);
  refresh();
}
async function importPaste(btn) {
  $('paste-err').textContent = '';
  const name = $('paste-name').value.trim(), content = $('paste-content').value.trim();
  if (!name || !content) { $('paste-err').textContent = '名称与内容均不能为空'; return; }
  busy(btn, true);
  try {
    const r = await j('/api/proxy/import-paste', {name, content});
    log(`导入成功，共 ${r.nodes} 个节点`);
    $('paste-content').value = '';
  } catch (e) { $('paste-err').textContent = e.message + '\n→ 支持 Clash YAML（proxies: 开头）或分享链接每行一条。'; log('导入失败: ' + e.message, true); }
  busy(btn, false);
  refresh();
}
$('file-pick').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { $('paste-err').textContent = '文件超过 8 MiB 上限'; return; }
  $('paste-content').value = await f.text();
  if (!$('paste-name').value.trim()) $('paste-name').value = f.name.replace(/\.(yaml|yml|txt)$/i, '');
  e.target.value = '';
});
async function scanLocal(btn) {
  $('scan-err').textContent = '';
  busy(btn, true);
  try {
    const r = await j('/api/proxy/scan-local');
    const list = $('scan-list');
    if (!r.found.length) {
      list.innerHTML = '<div class="hint">未发现本机 Clash 系配置 — 如果你用的订阅在其他客户端里，可以直接粘贴分享链接到上方。</div>';
    } else {
      list.innerHTML = r.found.map((f, i) =>
        `<div class="scan-item"><span class="p" title="${esc(f.path)}">${esc(f.path)}</span>
         <input id="scan-name-${i}" placeholder="来源名称" value="迁移配置">
         <button class="ghost" onclick="importLocal(this, '${esc(f.path)}', ${i})">导入</button></div>`).join('');
    }
  } catch (e) { $('scan-err').textContent = e.message; }
  busy(btn, false);
}
async function importLocal(btn, path, i) {
  const name = $('scan-name-' + i).value.trim() || '迁移配置';
  busy(btn, true);
  try {
    const r = await j('/api/proxy/import-local', {path, name});
    log(`迁移成功，共 ${r.nodes} 个节点`);
    $('scan-list').innerHTML = '';
  } catch (e) { $('scan-err').textContent = e.message; log('迁移失败: ' + e.message, true); }
  busy(btn, false);
  refresh();
}
async function act(btn, path, okMsg, errMsg) {
  $('status-err').textContent = '';
  busy(btn, true);
  try { await j(path, {}); log(okMsg || (path + ' 成功')); }
  catch (e) {
    $('status-err').textContent = e.message;
    log((errMsg ? errMsg + ' — ' : '') + path + ' 失败: ' + e.message, true);
  }
  busy(btn, false);
  refresh();
}
$('node-list').addEventListener('click', e => {
  const row = e.target.closest('.node');
  if (row) selectNode(row.dataset.id, row.querySelector('.n')?.textContent);
});
const KIND_COLOR = {cli:'#34c759', desktop:'#af52de', web:'#0071e3'};
let agentsCache = [];
async function refreshAgents() {
  try {
    agentsCache = await j('/api/agents');
    $('agent-list').innerHTML = agentsCache.map(a =>
      `<div class="side-item" data-id="${esc(a.id)}" title="${esc(a.note)}">
        <span class="ico" style="background:${KIND_COLOR[a.kind]||'#86868b'}">${esc(a.name.slice(0,1).toUpperCase())}</span>
        ${esc(a.name)}<span class="st" id="ast-${esc(a.id)}"></span></div>`).join('');
  } catch (e) { $('agent-list').innerHTML = '<div class="empty" style="padding:8px">加载失败</div>'; }
}
$('agent-list').addEventListener('click', async e => {
  const row = e.target.closest('.side-item');
  if (!row || !row.dataset.id) return;
  const a = agentsCache.find(x => x.id === row.dataset.id);
  if (!a) return;
  row.classList.add('busy');
  try {
    // 懒安装逻辑：先检测；未装→安装；已装→启动
    const d = await j('/api/agents/detect', {id: a.id});
    if (!d.installed) {
      if (!a.installable) {
        log(a.name + ' 需要手工安装——' + a.note, true);
        row.classList.remove('busy');
        return;
      }
      log('正在安装 ' + a.name + '（guest 内执行，可能需要几分钟）…');
      $('ast-' + a.id).textContent = '安装中';
      await j('/api/agents/install', {id: a.id});
      log(a.name + ' 安装完成——再次点击启动');
      $('ast-' + a.id).textContent = '已装';
      $('ast-' + a.id).classList.add('inst');
    } else {
      $('ast-' + a.id).textContent = '已装';
      $('ast-' + a.id).classList.add('inst');
      // 启动通道：终端内嵌是 0.8.5 下半期；先诚实引导
      log('→ ' + a.name + ' 已安装；终端内嵌通道建设中（0.8.5 下半期）——当前可 ssh 进 guest 直接运行');
    }
  } catch (e2) {
    log(a.name + ': ' + e2.message, true);
    $('ast-' + a.id).textContent = '';
  }
  row.classList.remove('busy');
});
refreshAgents();
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
